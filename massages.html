<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Let Love Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#160D14;
  --panel:#241420;
  --panel-2:#2E1A28;
  --rose:#E8879C;
  --rose-deep:#D66B85;
  --gold:#C9A15C;
  --cream:#F7EFE9;
  --blush:#FBE4E9;
  --muted:#B99DAA;
  --muted-dim:#8A7280;
  --line:rgba(247,239,233,0.09);
  --radius:20px;
  --radius-sm:12px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--cream);
  font-family:'Inter',sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
/* Any tappable UI element (buttons, nav links, pills, tabs, cards) should feel
   like a real button on mobile — not selectable text. Long-pressing these
   should activate a press state, never trigger the phone's text-selection menu. */
a, button, .pill, .ptab, .chat-item, .profile-card, .option-card, .filter-pill, nav.links a {
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
a[class], button, .pill, .ptab, .filter-pill {
  user-select:none; -webkit-user-select:none; -moz-user-select:none;
  -webkit-touch-callout:none;
}
h1,h2,h3,h4{font-family:'Fraunces',serif; letter-spacing:-0.01em; font-weight:600;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px;}

/* ===== signature connection-thread motif ===== */
.thread-svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible;}
.thread-path{
  fill:none; stroke:url(#threadGrad); stroke-width:1.5;
  stroke-dasharray:340; stroke-dashoffset:340;
  transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1);
}
.thread-active .thread-path{stroke-dashoffset:0;}
.thread-dot{fill:var(--rose); opacity:0; transition:opacity .4s ease .6s;}
.thread-active .thread-dot{opacity:1;}

/* ===== top bar ===== */
.topbar{background:#0F0810; color:var(--muted-dim); font-size:12.5px;}
.topbar .wrap{display:flex; justify-content:space-between; align-items:center; padding:7px 24px;}
.topbar .locale{display:flex; align-items:center; gap:16px;}
.topbar select{background:none; color:var(--muted-dim); border:none; font-size:12px;}

/* ===== nav ===== */
header.nav{
  background:rgba(22,13,20,0.85);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:100;
}
.nav .wrap{display:flex; align-items:center; justify-content:space-between; height:72px;}
.brand{display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:var(--cream);}
.brand .mark{
  width:36px; height:36px; border-radius:11px;
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));
  display:flex; align-items:center; justify-content:center;
  color:#160D14; font-size:16px; font-weight:700;
  box-shadow:0 6px 18px rgba(232,135,156,0.35);
  font-family:'Fraunces',serif;
}
nav.links{display:flex; gap:30px; font-size:13.5px; font-weight:500; color:var(--muted);}
nav.links a{transition:color .15s; position:relative; padding-bottom:4px;}
nav.links a:hover{color:var(--cream);}
nav.links a.active{color:var(--cream);}
nav.links a.active::after{content:''; position:absolute; left:0; right:0; bottom:-26px; height:2px; background:var(--rose);}
.nav-actions{display:flex; align-items:center; gap:12px;}
.menu-toggle{display:none; background:none; border:none; color:var(--cream); font-size:22px;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:12px; font-weight:600; font-size:14px;
  padding:12px 22px; cursor:pointer; border:none;
  transition:transform .15s, box-shadow .15s, background .15s, opacity .15s;
  white-space:nowrap;
  user-select:none; -webkit-user-select:none; -moz-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.btn:active{transform:scale(0.97);}
.btn-primary{
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));
  color:#1a0e14; box-shadow:0 8px 24px rgba(232,135,156,0.3);
}
.btn-primary:hover{box-shadow:0 10px 30px rgba(232,135,156,0.45);}
.btn-ghost{background:rgba(247,239,233,0.06); color:var(--cream); border:1px solid var(--line);}
.btn-ghost:hover{background:rgba(247,239,233,0.1);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#DDB876); color:#241606;}
.btn-block{width:100%;}
.btn-sm{padding:8px 16px; font-size:12.5px; border-radius:9px;}
.btn-icon{width:44px; height:44px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:17px;}

/* verified badge */
.vbadge{
  display:inline-flex; align-items:center; justify-content:center;
  width:16px; height:16px; border-radius:50%;
  background:linear-gradient(135deg,var(--gold),#EBCB8E);
  color:#241606; font-size:10px; font-weight:800;
  flex-shrink:0;
}

/* ===== hero ===== */
.hero{
  position:relative; overflow:hidden;
  background:
    radial-gradient(circle at 12% 15%, rgba(232,135,156,0.16), transparent 45%),
    radial-gradient(circle at 88% 85%, rgba(201,161,92,0.10), transparent 40%),
    linear-gradient(180deg,var(--bg) 0%, #1C1019 100%);
  padding:70px 0 100px;
}
.hero .wrap{display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:center;}
.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-size:12px; font-weight:600; letter-spacing:0.06em;
  color:var(--gold); text-transform:uppercase; margin-bottom:22px;
}
.eyebrow::before{content:''; width:18px; height:1px; background:var(--gold);}
.hero h1{font-size:48px; line-height:1.1; color:var(--cream); margin-bottom:22px; max-width:540px;}
.hero h1 em{color:var(--rose); font-style:italic;}
.hero p.sub{font-size:17px; color:var(--muted); max-width:460px; margin-bottom:34px; line-height:1.6;}
.hero-actions{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:36px;}

.hero-stage{position:relative; height:480px;}
.match-card{
  position:absolute; width:230px; border-radius:18px; overflow:hidden;
  border:1px solid rgba(247,239,233,0.12); box-shadow:0 30px 60px rgba(0,0,0,0.5);
  background:var(--panel);
}
.match-card img{width:100%; height:290px; object-fit:cover;}
.match-card .mc-info{padding:12px 14px;}
.match-card .mc-name{font-size:14px; font-weight:600; color:var(--cream); display:flex; align-items:center; gap:6px;}
.match-card .mc-loc{font-size:11.5px; color:var(--muted); margin-top:2px;}
.card-a{top:10px; left:0; z-index:2; transform:rotate(-4deg);}
.card-b{bottom:10px; right:0; z-index:2; transform:rotate(4deg);}

/* ===== sections ===== */
.section{padding:84px 0;}
.section-head{max-width:600px; margin-bottom:44px;}
.section-head .eyebrow{color:var(--rose);}
.section-head h2{font-size:32px; color:var(--cream); margin-bottom:12px;}
.section-head p{color:var(--muted); font-size:15px;}
.section.alt{background:var(--panel);}

.pill-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:32px;}
.pill{
  font-size:13px; padding:9px 18px; border-radius:22px; cursor:pointer;
  background:var(--panel-2); border:1px solid var(--line); color:var(--muted); font-weight:500;
  transition:all .15s;
}
.pill:hover{border-color:var(--rose);}
.pill.active{background:var(--rose); color:#1a0e14; border-color:var(--rose);}

/* ===== profile / discovery cards ===== */
.card-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
.profile-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; position:relative; transition:transform .2s, box-shadow .2s;
}
.profile-card:hover{transform:translateY(-5px); box-shadow:0 20px 45px rgba(0,0,0,0.4);}
.profile-card .pc-img{position:relative; height:230px; overflow:hidden;}
.profile-card .pc-img img{width:100%; height:100%; object-fit:cover;}
.pc-status{
  position:absolute; top:12px; left:12px;
  display:flex; align-items:center; gap:5px;
  background:rgba(15,8,16,0.7); backdrop-filter:blur(6px);
  padding:5px 10px; border-radius:20px; font-size:11px; color:var(--cream);
}
.pc-status .dot{width:6px;height:6px;border-radius:50%; background:#4ADE80;}
.pc-status.offline .dot{background:var(--muted-dim);}
.pc-gradient{position:absolute; bottom:0; left:0; right:0; height:70px; background:linear-gradient(180deg, transparent, rgba(15,8,16,0.85));}
.pc-body{padding:14px 16px 16px;}
.pc-name{font-size:15.5px; font-weight:600; color:var(--cream); display:flex; align-items:center; gap:6px;}
.pc-meta{font-size:12px; color:var(--muted); margin-top:3px;}
.pc-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
.pc-tag{font-size:10.5px; padding:3px 9px; border-radius:8px; background:rgba(232,135,156,0.12); color:var(--rose); border:1px solid rgba(232,135,156,0.25);}
.pc-actions{display:flex; gap:8px; margin-top:12px;}
.pc-actions .btn{flex:1; padding:9px; font-size:12.5px;}

/* ===== match reveal ===== */
.match-reveal{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:40px; text-align:center; position:relative; overflow:hidden;
}
.match-reveal .mr-pair{display:flex; align-items:center; justify-content:center; gap:0; margin-bottom:26px; position:relative; height:140px;}
.mr-photo{width:120px; height:120px; border-radius:50%; overflow:hidden; border:3px solid var(--rose); position:relative; z-index:2;}
.mr-photo img{width:100%; height:100%; object-fit:cover;}
.mr-photo.right{margin-left:-24px; border-color:var(--gold);}

/* ===== messages ===== */
.chat-shell{display:grid; grid-template-columns:340px 1fr; height:640px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--panel);}
.chat-list{border-right:1px solid var(--line); overflow-y:auto;}
.chat-search{padding:16px; border-bottom:1px solid var(--line);}
.chat-search input{
  width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
  padding:10px 14px; color:var(--cream); font-size:13.5px;
}
.chat-item{display:flex; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .15s;}
.chat-item:hover, .chat-item.active{background:var(--panel-2);}
.chat-item img{width:46px; height:46px; border-radius:50%; object-fit:cover; flex-shrink:0;}
.ci-body{flex:1; min-width:0;}
.ci-top{display:flex; justify-content:space-between; align-items:center;}
.ci-name{font-size:14px; font-weight:600; color:var(--cream); display:flex; align-items:center; gap:5px;}
.ci-time{font-size:11px; color:var(--muted-dim);}
.ci-preview{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px;}
.ci-unread{background:var(--rose); color:#1a0e14; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:10px;}

.chat-main{display:flex; flex-direction:column;}
.chat-header{display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line);}
.ch-user{display:flex; align-items:center; gap:12px;}
.ch-user img{width:42px; height:42px; border-radius:50%; object-fit:cover;}
.ch-name{font-size:14.5px; font-weight:600; color:var(--cream); display:flex; align-items:center; gap:6px;}
.ch-status{font-size:11.5px; color:#4ADE80;}
.ch-actions{display:flex; gap:8px;}
.ch-actions .btn-icon{background:var(--panel-2); color:var(--cream); font-size:15px;}
.ch-actions .btn-icon:hover{background:rgba(232,135,156,0.15); color:var(--rose);}

.chat-body{flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:14px;}
.msg{max-width:65%; padding:11px 15px; border-radius:16px; font-size:13.5px; line-height:1.45;}
.msg.them{background:var(--panel-2); color:var(--cream); border-bottom-left-radius:4px; align-self:flex-start;}
.msg.me{background:linear-gradient(135deg,var(--rose),var(--rose-deep)); color:#1a0e14; border-bottom-right-radius:4px; align-self:flex-end;}
.msg-time{font-size:10.5px; color:var(--muted-dim); margin-top:4px;}

.chat-composer{display:flex; align-items:center; gap:10px; padding:14px 20px; border-top:1px solid var(--line);}
.chat-composer input{flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:22px; padding:12px 18px; color:var(--cream); font-size:13.5px;}
.composer-icon{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--muted); background:var(--panel-2); font-size:15px; flex-shrink:0;}
.composer-icon:hover{color:var(--rose);}
.send-btn{width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,var(--rose),var(--rose-deep)); color:#1a0e14; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}

/* ===== profile page ===== */
.profile-hero{background:linear-gradient(180deg,var(--panel) 0%, var(--bg) 100%); padding:50px 0 0;}
.profile-header{display:flex; gap:28px; align-items:flex-end; padding-bottom:36px;}
.ph-avatar{width:150px; height:150px; border-radius:24px; overflow:hidden; border:3px solid var(--rose); flex-shrink:0; box-shadow:0 20px 45px rgba(0,0,0,0.4);}
.ph-avatar img{width:100%; height:100%; object-fit:cover;}
.ph-name{font-size:30px; color:var(--cream); display:flex; align-items:center; gap:10px;}
.ph-meta{font-size:14px; color:var(--muted); margin-top:6px;}
.ph-actions{display:flex; gap:10px; margin-left:auto; padding-bottom:6px;}

.profile-tabs{display:flex; gap:30px; border-bottom:1px solid var(--line); margin-top:10px;}
.ptab{padding:14px 2px; font-size:13.5px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer;}
.ptab.active{color:var(--cream); border-color:var(--rose);}

.info-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.info-box{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px;}
.info-box .il{font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted-dim); margin-bottom:6px;}
.info-box .iv{font-size:14.5px; color:var(--cream); font-weight:500;}

.progress-track{height:6px; background:var(--panel-2); border-radius:6px; overflow:hidden; margin-top:8px;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--rose),var(--gold));}

/* ===== form elements ===== */
.field{margin-bottom:18px;}
.field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:7px; font-weight:500;}
.field input, .field select, .field textarea{
  width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
  padding:12px 14px; color:var(--cream); font-size:13.5px; font-family:inherit;
}
.field textarea{resize:vertical; min-height:90px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}

/* ===== footer ===== */
footer{background:#0F0810; color:var(--muted-dim); padding:56px 0 24px;}
.footer-grid{display:grid; grid-template-columns:1.4fr repeat(4,1fr); gap:32px; padding-bottom:36px;}
.footer-grid h4{color:var(--cream); font-size:13px; margin-bottom:16px;}
.footer-grid ul{list-style:none;}
.footer-grid li{margin-bottom:10px; font-size:13.5px;}
.footer-grid a:hover{color:var(--cream);}
.footer-legal{border-top:1px solid var(--line); padding-top:20px; font-size:11.5px; color:#5C4A54; line-height:1.7;}
.footer-bottom{display:flex; justify-content:space-between; padding-top:20px; font-size:12px; flex-wrap:wrap; gap:10px;}

/* ===== responsive ===== */
/* ===== feed / social posts ===== */
.feed-shell{max-width:600px; margin:0 auto;}
.composer-box{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:24px;}
.composer-top{display:flex; gap:12px; align-items:flex-start;}
.composer-top img{width:42px; height:42px; border-radius:50%; object-fit:cover; flex-shrink:0;}
.composer-top textarea{
  flex:1; background:none; border:none; color:var(--cream); font-size:14px;
  font-family:inherit; resize:none; min-height:44px; padding-top:8px;
}
.composer-top textarea::placeholder{color:var(--muted-dim);}
.composer-media-preview{
  display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;
}
.composer-media-preview .thumb{
  width:74px; height:74px; border-radius:10px; overflow:hidden; position:relative;
  border:1px solid var(--line);
}
.composer-media-preview .thumb img{width:100%; height:100%; object-fit:cover;}
.composer-actions{display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}
.composer-tools{display:flex; gap:6px;}
.composer-tool-btn{
  width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  color:var(--muted); background:var(--panel-2); font-size:16px;
}
.composer-tool-btn:hover{color:var(--rose);}

.post-card{background:var(--panel); border:1px solid var(--line); border-radius:18px; margin-bottom:22px; overflow:hidden;}
.post-head{display:flex; align-items:center; gap:12px; padding:16px 18px;}
.post-head img.avatar{width:42px; height:42px; border-radius:50%; object-fit:cover;}
.post-head .p-name{font-size:14px; font-weight:600; color:var(--cream); display:flex; align-items:center; gap:5px;}
.post-head .p-time{font-size:12px; color:var(--muted-dim);}
.post-media{width:100%; max-height:520px; overflow:hidden; background:#0F0810;}
.post-media img, .post-media video{width:100%; max-height:520px; object-fit:cover; display:block;}
.post-caption{padding:14px 18px 4px; font-size:13.5px; color:var(--cream); line-height:1.5;}
.post-actions{display:flex; align-items:center; gap:6px; padding:12px 14px;}
.post-action-btn{
  display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted);
  padding:8px 12px; border-radius:10px;
}
.post-action-btn:hover{background:var(--panel-2); color:var(--rose);}
.post-action-btn.liked{color:var(--rose);}
.post-stats{padding:0 18px 14px; font-size:12px; color:var(--muted-dim);}

/* ===== call screens ===== */
.call-shell{
  min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 30%, rgba(232,135,156,0.12), transparent 60%), var(--bg);
  border-radius:24px; margin:20px 0; padding:40px 20px; text-align:center;
}
.call-avatar{width:120px; height:120px; border-radius:50%; overflow:hidden; border:3px solid var(--rose); margin-bottom:20px; box-shadow:0 0 0 12px rgba(232,135,156,0.08);}
.call-avatar img{width:100%; height:100%; object-fit:cover;}
.call-name{font-size:22px; color:var(--cream); margin-bottom:6px;}
.call-status{font-size:13.5px; color:var(--muted); margin-bottom:36px;}
.call-controls{display:flex; gap:18px; align-items:center;}
.call-btn{
  width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--panel-2); color:var(--cream); font-size:20px; border:1px solid var(--line);
}
.call-btn.end{background:#D64B5F; color:white; width:64px; height:64px; font-size:22px;}
.call-btn.active-mute{background:var(--rose); color:#1a0e14;}
.call-video-frame{
  width:100%; max-width:400px; aspect-ratio:3/4; border-radius:20px; overflow:hidden;
  background:var(--panel-2); margin-bottom:20px; position:relative; border:1px solid var(--line);
}
.call-video-frame img{width:100%; height:100%; object-fit:cover;}
.call-self-pip{
  position:absolute; bottom:12px; right:12px; width:72px; height:96px; border-radius:10px;
  overflow:hidden; border:2px solid rgba(247,239,233,0.3);
}
.call-self-pip img{width:100%; height:100%; object-fit:cover;}
.call-not-connected-badge{
  display:inline-flex; a
